apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rhdp-rca.fullname" . }}-batch
  labels:
    {{- include "rhdp-rca.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ include "rhdp-rca.fullname" . }}-batch
        spec:
          restartPolicy: Never
          initContainers:
          - name: setup-ssh
            image: {{ include "rhdp-rca.image" . }}
            command:
            - bash
            - -c
            args:
            - |
              echo "[INIT] Setting up SSH and configs..."
              mkdir -p /workspace/.ssh /workspace/.claude /workspace/.config/gcloud
              cp /tmp/ssh-secret/id_ed25519 /workspace/.ssh/id_ed25519
              chmod 600 /workspace/.ssh/id_ed25519
              cat > /workspace/.ssh/config <<EOF
              Host ci-bastion
                HostName $(cat /tmp/ssh-secret/bastion-hostname)
                User $(cat /tmp/ssh-secret/bastion-username)
                Port $(cat /tmp/ssh-secret/bastion-port)
                IdentityFile /workspace/.ssh/id_ed25519
                StrictHostKeyChecking no
                UserKnownHostsFile /dev/null

              Host ci-jumpbox
                HostName $(cat /tmp/ssh-secret/jumpbox-hostname)
                User $(cat /tmp/ssh-secret/jumpbox-username)
                Port $(cat /tmp/ssh-secret/jumpbox-port)
                IdentityFile /workspace/.ssh/id_ed25519
                StrictHostKeyChecking no
                UserKnownHostsFile /dev/null

              Host aap2-bastion
                HostName $(cat /tmp/ssh-secret/db-bastion-hostname)
                User $(cat /tmp/ssh-secret/db-bastion-username)
                Port $(cat /tmp/ssh-secret/db-bastion-port)
                IdentityFile /workspace/.ssh/id_ed25519
                StrictHostKeyChecking no
                UserKnownHostsFile /dev/null
              EOF
              chmod 600 /workspace/.ssh/config
              cp /tmp/claude-settings/settings.json /workspace/.claude/settings.json
              cp /tmp/gcp-creds/application_default_credentials.json /workspace/.config/gcloud/application_default_credentials.json

              echo "[INIT] Copying skills and scripts from image..."
              mkdir -p /workspace/.claude/skills /workspace/.claude/plugins/cache
              rsync -a --exclude='.analysis' --exclude='__pycache__' --exclude='*.pyc' --exclude='tests' --exclude='README.md' \
                /opt/app/skills/ /workspace/.claude/skills/
              cp -r /opt/app/plugins-cache/* /workspace/.claude/plugins/cache/
              cp -r /opt/app/batch/* /workspace/
              chmod +x /workspace/batch_rca_headless.sh
              echo "[INIT] Skills installed: $(ls /workspace/.claude/skills/ | tr '\n' ' ')"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: ssh-secret
              mountPath: /tmp/ssh-secret
              readOnly: true
            - name: claude-settings
              mountPath: /tmp/claude-settings
              readOnly: true
            - name: gcp-creds
              mountPath: /tmp/gcp-creds
              readOnly: true
          containers:
          - name: batch-rca
            image: {{ include "rhdp-rca.image" . }}
            command:
            - /bin/bash
            - -c
            - |
              cd /workspace
              echo "[INFO] Starting SSH tunnel to database..."
              DB_REMOTE_HOST=$(cat /tmp/ssh-secret/db-remote-host)
              DB_REMOTE_PORT=$(cat /tmp/ssh-secret/db-remote-port)
              ssh -f -N -L 15432:${DB_REMOTE_HOST}:${DB_REMOTE_PORT} aap2-bastion
              echo "[INFO] SSH tunnel established on localhost:15432"
              SINCE=$(date -u -d "{{ .Values.cronjob.since }} ago" "+%Y-%m-%d %H:%M:%S")
              ./batch_rca_headless.sh --limit {{ .Values.cronjob.limit }} --since "$SINCE"
            env:
            - name: CLAUDE_CODE_USE_VERTEX
              value: "1"
            - name: CLOUD_ML_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.vertexCreds }}
                  key: CLOUD_ML_REGION
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.vertexCreds }}
                  key: ANTHROPIC_VERTEX_PROJECT_ID
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /workspace/.config/gcloud/application_default_credentials.json
            - name: HOME
              value: /workspace
            - name: CLAUDE_CODE_ACCEPT_TOS
              value: "true"
            resources:
              requests:
                cpu: {{ .Values.resources.requests.cpu }}
                memory: {{ .Values.resources.requests.memory }}
              limits:
                cpu: {{ .Values.resources.limits.cpu | quote }}
                memory: {{ .Values.resources.limits.memory }}
            volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: ssh-secret
              mountPath: /tmp/ssh-secret
              readOnly: true
          volumes:
          - name: workspace
            persistentVolumeClaim:
              claimName: {{ include "rhdp-rca.fullname" . }}-pvc
          - name: gcp-creds
            secret:
              secretName: {{ .Values.secrets.names.vertexCreds }}
              items:
              - key: gcp-credentials
                path: application_default_credentials.json
          - name: claude-settings
            secret:
              secretName: {{ .Values.secrets.names.skillConfig }}
              items:
              - key: settings.json
                path: settings.json
          - name: ssh-secret
            secret:
              secretName: {{ .Values.secrets.names.sshKey }}

{{- if ne .Values.claude.backend "litellm" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.names.vertexCreds }}
  labels:
    {{- include "rhdp-rca.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLOUD_ML_REGION: {{ .Values.secrets.vertex.cloudMlRegion | quote }}
  ANTHROPIC_VERTEX_PROJECT_ID: {{ .Values.secrets.vertex.projectId | quote }}
  gcp-credentials: {{ .Values.secrets.vertex.gcpCredentials | quote }}
{{- end }}
{{- if eq .Values.claude.backend "litellm" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.names.litellmCreds }}
  labels:
    {{- include "rhdp-rca.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_BASE_URL: {{ .Values.secrets.litellm.baseUrl | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.litellm.apiKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.names.skillConfig }}
  labels:
    {{- include "rhdp-rca.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.json: {{ .Values.secrets.skillConfig.settingsJson | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.names.sshKey }}
  labels:
    {{- include "rhdp-rca.labels" . | nindent 4 }}
type: Opaque
stringData:
  id_ed25519: {{ .Values.secrets.ssh.privateKey | quote }}
  bastion-hostname: {{ .Values.secrets.ssh.bastionHostname | quote }}
  bastion-username: {{ .Values.secrets.ssh.bastionUsername | quote }}
  bastion-port: {{ .Values.secrets.ssh.bastionPort | quote }}
  db-bastion-hostname: {{ .Values.secrets.ssh.dbBastionHostname | quote }}
  db-bastion-username: {{ .Values.secrets.ssh.dbBastionUsername | quote }}
  db-bastion-port: {{ .Values.secrets.ssh.dbBastionPort | quote }}
  db-remote-host: {{ .Values.secrets.ssh.dbRemoteHost | quote }}
  db-remote-port: {{ .Values.secrets.ssh.dbRemotePort | quote }}
  jumpbox-hostname: {{ .Values.secrets.ssh.jumpboxHostname | quote }}
  jumpbox-username: {{ .Values.secrets.ssh.jumpboxUsername | quote }}
  jumpbox-port: {{ .Values.secrets.ssh.jumpboxPort | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.names.webhookSecret }}
  labels:
    {{- include "rhdp-rca.labels" . | nindent 4 }}
type: Opaque
stringData:
  WebHookSecretKey: {{ randAlphaNum 40 | quote }}

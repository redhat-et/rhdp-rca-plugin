services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rca_test
      POSTGRES_PASSWORD: rca_test
      POSTGRES_DB: rca_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_test -d rca_test"]
      interval: 2s
      timeout: 5s
      retries: 15
